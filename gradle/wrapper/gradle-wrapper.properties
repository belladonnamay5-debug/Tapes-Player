distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 发行包镜像。国内直连 services.gradle.org 很慢、还容易断。
# 默认走腾讯云镜像；阿里云镜像在这台机器上被 CDN 的 IP ACL 挡了（HTTP 403），
# 如果你的网络能访问阿里云，把 distributionUrl 换成下面注释里那行即可。
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.13-bin.zip
#distributionUrl=https\://mirrors.aliyun.com/gradle/gradle-8.13-bin.zip
#distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.13-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
